name: Aggiorna download APK

on:
  push:
    paths:
      - "downloads/**"
      - ".github/scripts/build_downloads.py"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write   # commit di rinomine, cancellazioni e manifest

# Un solo aggiornamento alla volta: se pushi due APK di fila, il secondo aspetta il primo.
concurrency:
  group: apk-downloads
  cancel-in-progress: false

jobs:
  update:
    # Evita loop: ignora i push fatti dal workflow stesso.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Installa lettore APK (per il versionCode)
        run: pip install pyaxmlparser

      - name: Rinomina APK, tieni le ultime 2 versioni, rigenera manifest e feed aggiornamenti
        run: python3 .github/scripts/build_downloads.py

      - name: Commit e push (solo se ci sono modifiche)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A downloads updates
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Niente [skip ci] nel messaggio: salterebbe anche il deploy di Cloudflare Pages.
          git commit -m "Aggiorna download APK"
          for i in 1 2 3; do
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rifiutato (qualcuno ha pushato nel frattempo), riprovo ($i/3)..."
            git pull --rebase
          done
          echo "::error::Push non riuscito dopo 3 tentativi. Rilancia il workflow da Actions."
          exit 1
